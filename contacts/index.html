<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NGH ECHO Directory</title>
  <style>
    :root {
      --bg: #1C1C1C;
      --surface: #2A2A2A;
      --gold: #FFD67A;
      --gold-light: #FFC04D;
      --gold-dim: rgba(255,214,122,0.12);
      --gold-border: rgba(255,214,122,0.55);
      --text: #FFFFFF;
      --text2: #D5D5D5;
      --text3: #9A9A9A;
      --border: #333333;
      --border2: #3A3A3A;

      --sec-color: #c8952a;
      --con-color: #5b9bd5;
      --nhc-color: #4caf7d;
      --ward-color: #9b72cf;
      --ci-color:  #e07b54;
      --other-color: #9A9A9A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      min-height: 100vh;
      font-size: 16px;
    }

    /* ── Top bar ── */
    .topbar {
      background: var(--bg);
      border-bottom: 1px solid var(--gold-border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .topbar-title {
      font-family: Arial, sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--gold-light);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .topbar-sub {
      font-size: 0.72rem;
      color: var(--text3);
      font-family: Arial, sans-serif;
    }


    /* ── Layout ── */
    .layout { height: calc(100vh - 52px); }

    /* ── Left panel ── */
    .left {
      width: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .search-wrap {
      padding: 12px;
      border-bottom: 1px solid var(--border2);
    }

    #search {
      width: 100%;
      background: var(--surface);
      border: 2px solid var(--gold);
      color: var(--text);
      font-family: Arial, sans-serif;
      font-size: 0.92rem;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
      border-radius: 4px;
    }

    #search::placeholder { color: var(--text3); }
    #search:focus { border-color: var(--gold-light); }

    .left-list {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    .left-list::-webkit-scrollbar { width: 4px; }
    .left-list::-webkit-scrollbar-track { background: var(--bg); }
    .left-list::-webkit-scrollbar-thumb { background: var(--border2); }

    /* ── Section header in list ── */
    .section-hdr {
      padding: 10px 14px 6px;
      font-size: 0.68rem;
      font-family: Arial, sans-serif;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid var(--border);
      margin-top: 4px;
    }

    .section-hdr:first-child { border-top: none; margin-top: 0; }

    .section-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── List item ── */
    .list-item {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .list-item:hover { background: var(--surface); }
    .list-item.selected { background: var(--gold-dim); border-left: 2px solid var(--gold); }

    .list-item-name {
      font-size: 0.98rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.3;
    }

    .list-item-sub {
      font-size: 0.84rem;
      color: var(--text3);
      font-family: Arial, sans-serif;
    }

    .list-item-ext {
      font-size: 0.82rem;
      color: var(--gold);
      font-family: Arial, sans-serif;
    }

    .detail-section-title {
      font-size: 0.68rem;
      font-family: Arial, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text3);
      margin: 10px 0 8px;
    }

    .contact-blocks {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .contact-block {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 2px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border2);
      transition: background 0.15s;
    }

    .contact-block:hover { background: rgba(255,255,255,0.02); }

    .cb-icon {
      font-size: 1rem;
      width: 22px;
      text-align: center;
      color: var(--text3);
      flex-shrink: 0;
    }

    .cb-body { flex: 1; min-width: 0; }

    .cb-label {
      font-size: 0.75rem;
      font-family: Arial, sans-serif;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 2px;
    }

    .cb-value {
      font-family: Arial, sans-serif;
      font-size: 0.98rem;
      color: var(--text);
      word-break: break-all;
    }

    .cb-value a {
      color: var(--gold-light);
      text-decoration: none;
    }

    .cb-value a:hover { text-decoration: underline; }

    .cb-copy {
      background: transparent;
      border: 1px solid var(--border2);
      color: var(--text3);
      font-family: Arial, sans-serif;
      font-size: 0.7rem;
      padding: 5px 10px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .cb-copy:hover {
      border-color: var(--gold-border);
      color: var(--gold-light);
    }

    .consultants-box {
      padding: 10px 0 12px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border2);
      margin-top: 8px;
    }

    .consultants-box-label {
      font-size: 0.65rem;
      font-family: Arial, sans-serif;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    .consultants-box-names {
      font-size: 0.92rem;
      color: var(--text2);
      line-height: 1.6;
    }

    .location-chip {
      display: inline-block;
      padding: 4px 12px;
      background: transparent;
      border: 1px solid var(--gold-border);
      color: var(--gold-light);
      font-family: Arial, sans-serif;
      font-size: 0.9rem;
    }

    .staff-chip {
      display: inline-block;
      padding: 4px 12px;
      background: transparent;
      border: 1px solid var(--border2);
      color: var(--text2);
      font-family: Arial, sans-serif;
      font-size: 0.78rem;
    }

    /* ── Stats footer ── */
    .stats-bar {
      padding: 8px 14px;
      border-top: 1px solid var(--border2);
      font-size: 0.8rem;
      font-family: Arial, sans-serif;
      color: var(--text3);
    }

    .stats-bar span { color: var(--gold); }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--surface);
      border: 2px solid var(--gold);
      color: var(--gold-light);
      font-family: Arial, sans-serif;
      font-size: 0.75rem;
      padding: 8px 18px;
      opacity: 0;
      transition: all 0.2s;
      pointer-events: none;
      z-index: 999;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── No results ── */
    .no-results {
      padding: 30px 14px;
      text-align: center;
      font-size: 0.75rem;
      font-family: Arial, sans-serif;
      color: var(--text3);
    }

    .item-details {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border2);
    }


    @media (max-width: 640px) {
      .left { width: 100%; max-width: 100%; border-right: none; }
      .layout { height: auto; }
      .left { height: calc(100vh - 52px); }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div></div>
  </div>

  <div class="layout">
    <!-- Left: search + list -->
    <div class="left">
      <div class="search-wrap">
        <input type="text" id="search" placeholder="Search contacts…" autocomplete="off" />
      </div>
      <div class="left-list" id="leftList"></div>
      <div class="stats-bar" id="stats"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let allContacts = [];
    let searchQuery = '';
    let selectedId = null;

    const CAT_COLORS = {
      'Cardiology Secretaries': '#c8952a',
      'Consultants':            '#5b9bd5',
      'Heart Centre':           '#4caf7d',
      'Cardiac Investigations': '#e07b54',
      'Wards':                  '#9b72cf',
      'Other':                  '#888888'
    };

    fetch('contacts.json')
      .then(r => r.json())
      .then(data => {
        allContacts = data.contacts;
        render();
      })
      .catch(() => {
        document.getElementById('leftList').innerHTML =
          '<div class="no-results">⚠ contacts.json not found</div>';
      });

    document.getElementById('search').addEventListener('input', e => {
      searchQuery = e.target.value.toLowerCase();
      render();
    });

    function matchesSearch(c) {
      if (!searchQuery) return true;
      const hay = [c.name, c.role, c.category, c.email, c.tel, c.ext,
                   c.mobile, c.internal, c.staff, c.location,
                   ...(c.consultants||[]), ...(c.tags||[])]
        .filter(Boolean).join(' ').toLowerCase();
      return searchQuery.split(' ').every(w => hay.includes(w));
    }

    function copyText(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        const t = document.getElementById('toast');
        t.textContent = `Copied: ${text}`;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
      });
    }

    function render() {
      const filtered = allContacts.filter(c => matchesSearch(c));

      const catOrder = ['Cardiology Secretaries','Consultants','Heart Centre','Cardiac Investigations','Wards','Other'];
      const groups = {};
      filtered.forEach(c => {
        (groups[c.category] = groups[c.category] || []).push(c);
      });

      let html = '';
      catOrder.forEach(cat => {
        const items = groups[cat];
        if (!items || items.length === 0) return;
        const color = CAT_COLORS[cat] || '#888';
        html += `<div class="section-hdr" style="color:${color}">
          <div class="section-dot" style="background:${color}"></div>
          ${cat}
        </div>`;
        items.forEach(c => {
          const extHint = c.ext ? ` · Ext ${c.ext}` : (c.tel ? ` · ${c.tel}` : '');
          const sub = c.consultants && c.consultants.length
            ? c.consultants.slice(0,2).join(', ') + (c.consultants.length > 2 ? '…' : '')
            : c.role;
          const detailsHtml = selectedId === c.id ? renderInlineDetails(c) : '';
          html += `<div class="list-item${selectedId===c.id?' selected':''}" data-id="${c.id}">
            <div class="list-item-name">${c.name}</div>
            <div class="list-item-sub">${sub}</div>
            ${extHint ? `<div class="list-item-ext">${extHint}</div>` : ''}
            ${detailsHtml}
          </div>`;
        });
      });

      if (filtered.length === 0) {
        html = `<div class="no-results">No results for "${searchQuery}"</div>`;
      }

      document.getElementById('leftList').innerHTML = html;
      document.getElementById('stats').innerHTML =
        `<span>${filtered.length}</span> of ${allContacts.length} contacts`;

      // Rebind clicks
      document.querySelectorAll('.list-item').forEach(el => {
        el.addEventListener('click', () => {
          const id = parseInt(el.dataset.id);
          selectedId = selectedId === id ? null : id;
          render();
        });
      });
    }

    function renderInlineDetails(c) {
      let contactBlocksHtml = '';

      if (c.ext) contactBlocksHtml += contactBlock('⌗', 'Extension', c.ext, c.ext);
      if (c.internal) contactBlocksHtml += contactBlock('⌗', 'Internal', c.internal, c.internal);
      if (c.tel) contactBlocksHtml += contactBlock('☎', 'Telephone', c.tel, c.tel);
      if (c.mobile) contactBlocksHtml += contactBlock('✆', 'Mobile', c.mobile, c.mobile);
      if (c.email) contactBlocksHtml += contactBlockEmail(c.email);
      if (c.location) {
        contactBlocksHtml += `<div class="contact-block">
          <div class="cb-icon">⌖</div>
          <div class="cb-body"><div class="cb-label">Area Location</div>
          <div class="cb-value"><span class="location-chip">Area ${c.location}</span></div></div>
        </div>`;
      }
      if (c.staff) {
        contactBlocksHtml += `<div class="contact-block">
          <div class="cb-icon">👤</div>
          <div class="cb-body"><div class="cb-label">Staff</div>
          <div class="cb-value">${c.staff}</div></div>
        </div>`;
      }

      const consultantsHtml = c.consultants && c.consultants.length
        ? `<div class="consultants-box">
            <div class="consultants-box-label">Covers Consultants</div>
            <div class="consultants-box-names">${c.consultants.join('<br>')}</div>
           </div>` : '';

      return `<div class="item-details">
        ${consultantsHtml}
        ${contactBlocksHtml ? `<div class="detail-section-title">Contact Details</div><div class="contact-blocks">${contactBlocksHtml}</div>` : '<div style="color:var(--text3);font-family:Arial,sans-serif;font-size:0.8rem">No contact details on record.</div>'}
      </div>`;
    }

    function contactBlock(icon, label, value, copyVal) {
      return `<div class="contact-block">
        <div class="cb-icon">${icon}</div>
        <div class="cb-body">
          <div class="cb-label">${label}</div>
          <div class="cb-value">${value}</div>
        </div>
        <button class="cb-copy" onclick="copyText('${copyVal}','${label}')">COPY</button>
      </div>`;
    }

    function contactBlockEmail(email) {
      return `<div class="contact-block">
        <div class="cb-icon">✉</div>
        <div class="cb-body">
          <div class="cb-label">Email</div>
          <div class="cb-value"><a href="mailto:${email}">${email}</a></div>
        </div>
        <button class="cb-copy" onclick="copyText('${email}','Email')">COPY</button>
      </div>`;
    }

  </script>
</body>
</html>
