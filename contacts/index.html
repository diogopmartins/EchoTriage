<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NGH ECHO Directory</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #111111;
      --surface: #1a1a1a;
      --gold: #c8952a;
      --gold-light: #e8b84b;
      --gold-dim: rgba(200,149,42,0.15);
      --gold-border: rgba(200,149,42,0.4);
      --text: #e8e8e8;
      --text2: #aaaaaa;
      --text3: #666666;
      --border: #2a2a2a;
      --border2: #333333;

      --sec-color: #c8952a;
      --con-color: #5b9bd5;
      --nhc-color: #4caf7d;
      --ward-color: #9b72cf;
      --ci-color:  #e07b54;
      --other-color: #888888;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
      font-size: 14px;
    }

    /* ── Top bar ── */
    .topbar {
      background: #0d0d0d;
      border-bottom: 1px solid var(--gold-border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .topbar-title {
      font-family: 'Roboto Mono', monospace;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--gold-light);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .topbar-sub {
      font-size: 0.72rem;
      color: var(--text3);
      font-family: 'Roboto Mono', monospace;
    }

    /* ── Tab bar ── */
    .tabbar {
      background: #0d0d0d;
      border-bottom: 1px solid var(--border2);
      display: flex;
      gap: 0;
      padding: 0 20px;
      overflow-x: auto;
    }

    .tab {
      padding: 9px 22px;
      font-size: 0.78rem;
      font-weight: 500;
      font-family: 'Roboto Mono', monospace;
      color: var(--text3);
      cursor: pointer;
      border: 1px solid transparent;
      border-bottom: none;
      background: transparent;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      position: relative;
      top: 1px;
      letter-spacing: 0.03em;
    }

    .tab:hover { color: var(--text2); }

    .tab.active {
      color: var(--gold-light);
      border-color: var(--gold-border);
      background: var(--surface);
    }

    /* ── Layout ── */
    .layout {
      display: flex;
      height: calc(100vh - 84px);
    }

    /* ── Left panel ── */
    .left {
      width: 340px;
      min-width: 260px;
      max-width: 420px;
      border-right: 1px solid var(--border2);
      display: flex;
      flex-direction: column;
      background: var(--bg);
      flex-shrink: 0;
    }

    .search-wrap {
      padding: 12px;
      border-bottom: 1px solid var(--border2);
    }

    #search {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--gold-border);
      color: var(--text);
      font-family: 'Roboto Mono', monospace;
      font-size: 0.8rem;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    #search::placeholder { color: var(--text3); }
    #search:focus { border-color: var(--gold-light); }

    .left-list {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    .left-list::-webkit-scrollbar { width: 4px; }
    .left-list::-webkit-scrollbar-track { background: var(--bg); }
    .left-list::-webkit-scrollbar-thumb { background: var(--border2); }

    /* ── Section header in list ── */
    .section-hdr {
      padding: 10px 14px 6px;
      font-size: 0.68rem;
      font-family: 'Roboto Mono', monospace;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid var(--border);
      margin-top: 4px;
    }

    .section-hdr:first-child { border-top: none; margin-top: 0; }

    .section-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── List item ── */
    .list-item {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .list-item:hover { background: var(--surface); }
    .list-item.selected { background: var(--gold-dim); border-left: 2px solid var(--gold); }

    .list-item-name {
      font-size: 0.83rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.3;
    }

    .list-item-sub {
      font-size: 0.72rem;
      color: var(--text3);
      font-family: 'Roboto Mono', monospace;
    }

    .list-item-ext {
      font-size: 0.72rem;
      color: var(--gold);
      font-family: 'Roboto Mono', monospace;
    }

    /* ── Right panel ── */
    .right {
      flex: 1;
      overflow-y: auto;
      background: var(--bg);
      padding: 0;
    }

    .right::-webkit-scrollbar { width: 5px; }
    .right::-webkit-scrollbar-track { background: var(--bg); }
    .right::-webkit-scrollbar-thumb { background: var(--border2); }

    /* ── Detail view ── */
    .detail-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text3);
      font-family: 'Roboto Mono', monospace;
      font-size: 0.8rem;
      gap: 10px;
    }

    .detail-empty-icon { font-size: 2.5rem; opacity: 0.3; }

    .detail-wrap { padding: 28px 32px; max-width: 680px; }

    .detail-cat {
      font-size: 0.68rem;
      font-family: 'Roboto Mono', monospace;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .detail-name {
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.25;
    }

    .detail-role {
      font-size: 0.8rem;
      color: var(--text3);
      margin-bottom: 24px;
      font-family: 'Roboto Mono', monospace;
    }

    .detail-divider {
      border: none;
      border-top: 1px solid var(--border2);
      margin: 20px 0;
    }

    .detail-section-title {
      font-size: 0.68rem;
      font-family: 'Roboto Mono', monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 12px;
    }

    .contact-blocks {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contact-block {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border2);
      transition: border-color 0.15s;
    }

    .contact-block:hover { border-color: var(--gold-border); }

    .cb-icon {
      font-size: 1rem;
      width: 22px;
      text-align: center;
      color: var(--text3);
      flex-shrink: 0;
    }

    .cb-body { flex: 1; min-width: 0; }

    .cb-label {
      font-size: 0.65rem;
      font-family: 'Roboto Mono', monospace;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 2px;
    }

    .cb-value {
      font-family: 'Roboto Mono', monospace;
      font-size: 0.88rem;
      color: var(--text);
      word-break: break-all;
    }

    .cb-value a {
      color: var(--gold-light);
      text-decoration: none;
    }

    .cb-value a:hover { text-decoration: underline; }

    .cb-copy {
      background: transparent;
      border: 1px solid var(--border2);
      color: var(--text3);
      font-family: 'Roboto Mono', monospace;
      font-size: 0.7rem;
      padding: 5px 10px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .cb-copy:hover {
      border-color: var(--gold);
      color: var(--gold-light);
    }

    .consultants-box {
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border2);
      margin-bottom: 10px;
    }

    .consultants-box-label {
      font-size: 0.65rem;
      font-family: 'Roboto Mono', monospace;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    .consultants-box-names {
      font-size: 0.82rem;
      color: var(--text2);
      line-height: 1.6;
    }

    .location-chip {
      display: inline-block;
      padding: 4px 12px;
      background: var(--surface);
      border: 1px solid var(--gold-border);
      color: var(--gold-light);
      font-family: 'Roboto Mono', monospace;
      font-size: 0.78rem;
    }

    .staff-chip {
      display: inline-block;
      padding: 4px 12px;
      background: var(--surface);
      border: 1px solid var(--border2);
      color: var(--text2);
      font-family: 'Roboto Mono', monospace;
      font-size: 0.78rem;
    }

    /* ── Stats footer ── */
    .stats-bar {
      padding: 8px 14px;
      border-top: 1px solid var(--border2);
      font-size: 0.68rem;
      font-family: 'Roboto Mono', monospace;
      color: var(--text3);
    }

    .stats-bar span { color: var(--gold); }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #0d0d0d;
      border: 1px solid var(--gold);
      color: var(--gold-light);
      font-family: 'Roboto Mono', monospace;
      font-size: 0.75rem;
      padding: 8px 18px;
      opacity: 0;
      transition: all 0.2s;
      pointer-events: none;
      z-index: 999;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── No results ── */
    .no-results {
      padding: 30px 14px;
      text-align: center;
      font-size: 0.75rem;
      font-family: 'Roboto Mono', monospace;
      color: var(--text3);
    }

    @media (max-width: 640px) {
      .left { width: 100%; max-width: 100%; border-right: none; }
      .right { display: none; }
      .layout { height: auto; }
      .left { height: calc(100vh - 84px); }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div>
      <div class="topbar-title">Directory</div>
      <div class="topbar-sub">ECHOCARDIOGRAPHY</div>
    </div>
  </div>

  <div class="tabbar" id="tabbar">
    <button class="tab active" data-filter="all">All</button>
    <button class="tab" data-filter="Cardiology Secretaries">Secretaries</button>
    <button class="tab" data-filter="Consultants">Consultants</button>
    <button class="tab" data-filter="Heart Centre">Heart Centre</button>
    <button class="tab" data-filter="Cardiac Investigations">Cardiac Inv.</button>
    <button class="tab" data-filter="Wards">Wards</button>
    <button class="tab" data-filter="Other">Other</button>
  </div>

  <div class="layout">
    <!-- Left: search + list -->
    <div class="left">
      <div class="search-wrap">
        <input type="text" id="search" placeholder="Search contacts…" autocomplete="off" />
      </div>
      <div class="left-list" id="leftList"></div>
      <div class="stats-bar" id="stats"></div>
    </div>

    <!-- Right: detail -->
    <div class="right" id="rightPanel">
      <div class="detail-empty">
        <div class="detail-empty-icon">☎</div>
        <div>Select a contact to view details</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let allContacts = [];
    let activeFilter = 'all';
    let searchQuery = '';
    let selectedId = null;

    const CAT_COLORS = {
      'Cardiology Secretaries': '#c8952a',
      'Consultants':            '#5b9bd5',
      'Heart Centre':           '#4caf7d',
      'Cardiac Investigations': '#e07b54',
      'Wards':                  '#9b72cf',
      'Other':                  '#888888'
    };

    const CAT_LABELS = {
      'Cardiology Secretaries': 'Secretary',
      'Consultants':            'Consultant',
      'Heart Centre':           'NHC',
      'Cardiac Investigations': 'CI Team',
      'Wards':                  'Ward',
      'Other':                  'Other'
    };

    fetch('contacts.json')
      .then(r => r.json())
      .then(data => {
        allContacts = data.contacts;
        render();
      })
      .catch(() => {
        document.getElementById('leftList').innerHTML =
          '<div class="no-results">⚠ contacts.json not found</div>';
      });

    document.getElementById('search').addEventListener('input', e => {
      searchQuery = e.target.value.toLowerCase();
      render();
    });

    document.getElementById('tabbar').addEventListener('click', e => {
      const btn = e.target.closest('.tab');
      if (!btn) return;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      render();
    });

    function matchesSearch(c) {
      if (!searchQuery) return true;
      const hay = [c.name, c.role, c.category, c.email, c.tel, c.ext,
                   c.mobile, c.internal, c.staff, c.location,
                   ...(c.consultants||[]), ...(c.tags||[])]
        .filter(Boolean).join(' ').toLowerCase();
      return searchQuery.split(' ').every(w => hay.includes(w));
    }

    function matchesFilter(c) {
      return activeFilter === 'all' || c.category === activeFilter;
    }

    function copyText(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        const t = document.getElementById('toast');
        t.textContent = `Copied: ${text}`;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
      });
    }

    function render() {
      const filtered = allContacts.filter(c => matchesFilter(c) && matchesSearch(c));

      const catOrder = ['Cardiology Secretaries','Consultants','Heart Centre','Cardiac Investigations','Wards','Other'];
      const groups = {};
      filtered.forEach(c => {
        (groups[c.category] = groups[c.category] || []).push(c);
      });

      let html = '';
      catOrder.forEach(cat => {
        const items = groups[cat];
        if (!items || items.length === 0) return;
        const color = CAT_COLORS[cat] || '#888';
        html += `<div class="section-hdr" style="color:${color}">
          <div class="section-dot" style="background:${color}"></div>
          ${cat}
        </div>`;
        items.forEach(c => {
          const extHint = c.ext ? ` · Ext ${c.ext}` : (c.tel ? ` · ${c.tel}` : '');
          const sub = c.consultants && c.consultants.length
            ? c.consultants.slice(0,2).join(', ') + (c.consultants.length > 2 ? '…' : '')
            : c.role;
          html += `<div class="list-item${selectedId===c.id?' selected':''}" data-id="${c.id}">
            <div class="list-item-name">${c.name}</div>
            <div class="list-item-sub">${sub}</div>
            ${extHint ? `<div class="list-item-ext">${extHint}</div>` : ''}
          </div>`;
        });
      });

      if (filtered.length === 0) {
        html = `<div class="no-results">No results for "${searchQuery}"</div>`;
      }

      document.getElementById('leftList').innerHTML = html;
      document.getElementById('stats').innerHTML =
        `<span>${filtered.length}</span> of ${allContacts.length} contacts`;

      // Rebind clicks
      document.querySelectorAll('.list-item').forEach(el => {
        el.addEventListener('click', () => {
          const id = parseInt(el.dataset.id);
          selectedId = id;
          document.querySelectorAll('.list-item').forEach(x => x.classList.remove('selected'));
          el.classList.add('selected');
          showDetail(id);
        });
      });

      // Refresh detail if selected contact still in filtered
      if (selectedId) {
        const still = filtered.find(c => c.id === selectedId);
        if (still) showDetail(selectedId);
      }
    }

    function showDetail(id) {
      const c = allContacts.find(x => x.id === id);
      if (!c) return;
      const color = CAT_COLORS[c.category] || '#888';
      const label = CAT_LABELS[c.category] || c.category;

      let contactBlocksHtml = '';

      if (c.ext) contactBlocksHtml += contactBlock('⌗', 'Extension', c.ext, c.ext);
      if (c.internal) contactBlocksHtml += contactBlock('⌗', 'Internal', c.internal, c.internal);
      if (c.tel) contactBlocksHtml += contactBlock('☎', 'Telephone', c.tel, c.tel);
      if (c.mobile) contactBlocksHtml += contactBlock('✆', 'Mobile', c.mobile, c.mobile);
      if (c.email) contactBlocksHtml += contactBlockEmail(c.email);
      if (c.location) {
        contactBlocksHtml += `<div class="contact-block">
          <div class="cb-icon">⌖</div>
          <div class="cb-body"><div class="cb-label">Area Location</div>
          <div class="cb-value"><span class="location-chip">Area ${c.location}</span></div></div>
        </div>`;
      }
      if (c.staff) {
        contactBlocksHtml += `<div class="contact-block">
          <div class="cb-icon">👤</div>
          <div class="cb-body"><div class="cb-label">Staff</div>
          <div class="cb-value">${c.staff}</div></div>
        </div>`;
      }

      const consultantsHtml = c.consultants && c.consultants.length
        ? `<div class="consultants-box">
            <div class="consultants-box-label">Covers Consultants</div>
            <div class="consultants-box-names">${c.consultants.join('<br>')}</div>
           </div>` : '';

      document.getElementById('rightPanel').innerHTML = `
        <div class="detail-wrap">
          <div class="detail-cat" style="color:${color}">${label}</div>
          <div class="detail-name">${c.name}</div>
          <div class="detail-role">${c.role || c.subcategory || ''}</div>
          ${consultantsHtml}
          ${contactBlocksHtml ? `<div class="detail-section-title">Contact Details</div><div class="contact-blocks">${contactBlocksHtml}</div>` : '<div style="color:var(--text3);font-family:Roboto Mono,monospace;font-size:0.8rem">No contact details on record.</div>'}
        </div>
      `;
    }

    function contactBlock(icon, label, value, copyVal) {
      return `<div class="contact-block">
        <div class="cb-icon">${icon}</div>
        <div class="cb-body">
          <div class="cb-label">${label}</div>
          <div class="cb-value">${value}</div>
        </div>
        <button class="cb-copy" onclick="copyText('${copyVal}','${label}')">COPY</button>
      </div>`;
    }

    function contactBlockEmail(email) {
      return `<div class="contact-block">
        <div class="cb-icon">✉</div>
        <div class="cb-body">
          <div class="cb-label">Email</div>
          <div class="cb-value"><a href="mailto:${email}">${email}</a></div>
        </div>
        <button class="cb-copy" onclick="copyText('${email}','Email')">COPY</button>
      </div>`;
    }
  </script>
</body>
</html>
